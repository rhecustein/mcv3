name: outlet_app
description: SehatCert Outlet Staff App - Certificate issuance on-the-go
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared packages
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  domain:
    path: ../../packages/domain
  presentation:
    path: ../../packages/presentation

  # State Management
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.3
  bloc_concurrency: ^0.2.4

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # UI Components
  phosphor_flutter: ^2.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Form Handling
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # PDF & QR Code
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  syncfusion_flutter_pdfviewer: ^24.1.41
  signature: ^5.4.1

  # Image & Camera
  image_picker: ^1.0.7
  camera: ^0.10.5+7

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.2+1
  equatable: ^2.0.5
  dartz: ^0.10.1
  connectivity_plus: ^5.0.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.0

  # Permissions
  permission_handler: ^11.1.0

  # Local Auth
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
