name: core
description: Core utilities, constants, and extensions for SehatCert mobile apps
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities
  logger: ^2.0.2+1
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1

  # Linting
  very_good_analysis: ^5.1.0

  # Testing
  mocktail: ^1.0.2
